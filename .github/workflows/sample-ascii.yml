name: sample-ascii-preview

on:
  push:
    paths:
      - ".github/workflows/sample-ascii.yml"

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Download simple illustrations
        run: |
          mkdir -p /tmp/jev-illustrations
          curl -L --fail --retry 3 "https://raw.githubusercontent.com/twitter/twemoji/master/assets/72x72/1f431.png" -o /tmp/jev-illustrations/cat_face.png
          curl -L --fail --retry 3 "https://raw.githubusercontent.com/twitter/twemoji/master/assets/72x72/1f436.png" -o /tmp/jev-illustrations/dog_face.png
          curl -L --fail --retry 3 "https://raw.githubusercontent.com/twitter/twemoji/master/assets/72x72/1f408.png" -o /tmp/jev-illustrations/cat_body.png
          curl -L --fail --retry 3 "https://raw.githubusercontent.com/twitter/twemoji/master/assets/72x72/1f415.png" -o /tmp/jev-illustrations/dog_body.png
      - name: Render illustration ASCII
        run: |
          for f in cat_face dog_face cat_body dog_body; do
            echo "===== $f ====="
            python preview_ascii.py "/tmp/jev-illustrations/$f.png" --mode plain --width 32 --height 32 --chars "@#*:."
          done
